[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "video-cleaner"
version = "0.1.0"
description = "Re-encode a video library to HEVC with x265, safely and non-destructively."
readme = "README.md"
license = { text = "MIT" }
# 3.11 is the oldest tested; below 3.13 because newer versions are not verified (see ci.yml).
requires-python = ">=3.11,<3.13"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "keyring>=25.7.0",
    "pysubs2>=1.8.1",
    "ffsubsync>=0.5.1",
    "guessit>=4.4.0",
]

[project.scripts]
video-cleaner = "video_cleaner.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "bandit>=1.9.4",
    "pip-audit>=2.10.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/video_cleaner"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `from helpers import ...` / `from media import ...` resolve without relying on rootdir insertion.
pythonpath = ["tests"]
# Tests write only under pytest's tmp_path. Keep the folders of failing tests for a post-mortem
# and remove everything else when the run ends, instead of leaving three runs in the system
# temp folder.
tmp_path_retention_policy = "failed"
addopts = "-ra --strict-markers --strict-config --cov=src/video_cleaner --cov-report=term-missing"
markers = [
    "integration: tests that run real ffmpeg/ffprobe against generated media",
    "gpu: tests that require a GPU (excluded from CI)",
    "local: tests that require the local NAS/library (excluded from CI)",
]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.bandit]
exclude_dirs = ["tests", ".venv", ".claude"]
